server.port=8080
server.address=0.0.0.0

# Local SQLite Database Path (With Lock Prevention)
spring.datasource.url=jdbc:sqlite:${user.home}/.pos_app/pos_local_db.sqlite?journal_mode=WAL&busy_timeout=10000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# SQLite Connection Pool Size Restriction
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.application.name=pos-backend

